CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n

# Used to report how many calibrations completed during the sleep.
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_DEBUG=y

# Reproduce the LF clock request/release transition involved in the failure.
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_LF_ALWAYS_ON=n
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=10000
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=100

# The enabled LFRC devicetree node defaults the Zephyr driver on. The Zephyr
# driver then selects its nrfx backend. These can be stated explicitly, but
# normally should not be necessary:
# CONFIG_CLOCK_CONTROL_NRF_LFRC=y
# CONFIG_NRFX_CLOCK_LFRC=y

# Alternative configurations that avoid the failing clock transition:
# CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_LF_ALWAYS_ON=y
# CONFIG_NRF_GRTC_ALWAYS_ON=y
# CONFIG_NRF_GRTC_TIMER_SOURCE_LFXO=y

# Keep periodic calibration out of the observation window:
# CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=60000

# The original ztest uses this together with its mocked temperature sensor:
# CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=1
